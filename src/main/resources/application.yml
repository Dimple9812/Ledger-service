spring:
  application:
    name: ledger-service

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/ledger_db
    username: ledger
    password: ledger1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080